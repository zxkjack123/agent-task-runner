name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests with coverage
        run: uv run --group dev --with pytest-cov pytest -m "not e2e" --cov=src/loop_kit --cov-report=xml --junitxml=pytest-results.xml

      - name: Run integration tests (if present)
        shell: bash
        run: |
          if uv run python - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(r"pytest\.mark\.integration")
          has_integration = any(
              pattern.search(path.read_text(encoding="utf-8"))
              for path in Path("tests").rglob("test_*.py")
          )
          raise SystemExit(0 if has_integration else 1)
          PY
          then
            uv run --group dev pytest -m integration --junitxml=pytest-integration-results.xml
          else
            echo "No integration-marked tests found; skipping."
          fi

      - name: Compile check
        run: uv run python -m py_compile src/loop_kit/orchestrator.py

      - name: Import check
        run: uv run python -c "from loop_kit.orchestrator import *"

      - name: CLI smoke test
        run: uv run python -m loop_kit --help

      - name: Run Ruff
        run: uv run --group dev ruff check src/loop_kit tests

      - name: Run mypy (optional)
        continue-on-error: true
        run: uv run --group dev --with mypy mypy src/loop_kit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            pytest-integration-results.xml
          if-no-files-found: warn

  # 跨平台 / 多 Python 版本兼容门禁（借鉴上游 ci.yml matrix，2026-09-12 补强）
  # 覆盖此前 CI 的两类盲区：
  #   1) Windows 代码路径（_core.py `os.name=="nt"` / msvcrt 文件锁）—— 上游曾测 windows-latest，fork 消失
  #   2) requires-python 声明范围（>=3.11）中的 3.12 / 3.13
  # 与主作业 `ci` 分离：主作业保留完整质量链（coverage/ruff/mypy），本作业只做「装依赖 + 跑测试」以控制耗时。
  compat:
    name: compat (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # 三条 leg 均为硬门禁。Windows leg 的 10 个缺陷（msvcrt 文件锁 /
    # grandchild-holds-pipe 管道语义 / 路径分隔符 / signal.SIGKILL）已于
    # #T-3617 修复并转绿，故 advisory 豁免已移除。
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests (exclude e2e)
        run: uv run --group dev pytest -m "not e2e"
